<!DOCTYPE html>

<html lang="hu">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Property Titan</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07090f;color:#e5e8f2;font-family:'DM Sans',sans-serif;min-height:100vh}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.page{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px}
.page.active{display:flex}
.grid{background-image:linear-gradient(#1a2238 1px,transparent 1px),linear-gradient(90deg,#1a2238 1px,transparent 1px);background-size:54px 54px;position:fixed;inset:0;opacity:.25;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;width:100%;max-width:840px;text-align:center}
h1.big{font-size:clamp(48px,8vw,88px);font-weight:600;line-height:.9;letter-spacing:-.03em;color:#e5e8f2}
h1.gold{font-size:clamp(48px,8vw,88px);font-weight:600;line-height:.95;letter-spacing:-.03em;font-style:italic;background:linear-gradient(135deg,#c9a84c,#e0be70);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.badge{display:inline-flex;align-items:center;gap:7px;background:rgba(201,168,76,.09);border:1px solid rgba(201,168,76,.2);border-radius:99px;padding:5px 14px;margin-bottom:22px}
.dot{width:5px;height:5px;border-radius:50%;background:#c9a84c;animation:pulse 2s ease infinite;box-shadow:0 0 6px #c9a84c}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.lang-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:28px;width:100%}
.lang-btn{background:#101524;border:1px solid #232d44;border-radius:14px;padding:18px 12px;cursor:pointer;color:#e5e8f2;font-family:inherit;transition:all .2s}
.lang-btn:hover{border-color:#c9a84c;transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.3)}
.flag{font-size:28px;margin-bottom:8px}
.lname{font-size:12px;font-weight:700;color:#7e8fa8}

/* LOGIN */
.login-box{background:#101524;border:1px solid #232d44;border-radius:20px;padding:40px;width:100%;max-width:420px}
.inp-wrap{margin-bottom:14px}
.inp-wrap label{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#39495e;margin-bottom:6px}
.inp-wrap input{width:100%;padding:11px 13px;background:#0c0f1a;border:1.5px solid #232d44;border-radius:8px;color:#e5e8f2;font-size:13px;font-family:inherit;outline:none;transition:border-color .18s}
.inp-wrap input:focus{border-color:#c9a84c;box-shadow:0 0 0 3px rgba(201,168,76,.08)}
.btn-gold{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg,#c9a84c,#e0be70);color:#07080c;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;box-shadow:0 4px 20px rgba(201,168,76,.25)}
.btn-gold:disabled{background:#2c3a54;color:#39495e;cursor:not-allowed;box-shadow:none}
.err{margin-top:12px;padding:10px 14px;border-radius:8px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);font-size:12px;color:#fca5a5;display:none}
.sp{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.2);border-top-color:#07080c;border-radius:50%;animation:spin .7s linear infinite}

/* COUNTRY */
.country-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:11px;margin-top:20px;width:100%}
.country-btn{background:#101524;border:1px solid #232d44;border-radius:14px;padding:18px 14px;cursor:pointer;color:#e5e8f2;font-family:inherit;transition:all .25s;text-align:center}
.country-btn:hover{border-color:#c9a84c;transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.3)}

/* DASH */
#dash{display:none;flex-direction:column;min-height:100vh}
#dash.active{display:flex}
.topbar{background:#0c0f1a;border-bottom:1px solid #1a2238;padding:0 16px;height:52px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;flex-shrink:0}
.apibar{background:#060c18;border-bottom:1px solid #091225;padding:8px 16px}
.apibar-inner{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.api-inp{flex:1;min-width:140px;padding:7px 11px;background:rgba(59,130,246,.05);border:1.5px solid #0b1e38;border-radius:7px;color:#93c5fd;font-family:monospace;font-size:12px;outline:none}
.api-btn{padding:7px 14px;border-radius:7px;border:1.5px solid rgba(59,130,246,.2);background:rgba(59,130,246,.07);color:#93c5fd;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit}
.banner{background:linear-gradient(90deg,rgba(201,168,76,.05),rgba(59,130,246,.03));border-bottom:1px solid #1a2238;padding:9px 16px;font-size:12px;font-weight:700;color:#e0be70}
.tabs{display:flex;overflow-x:auto;background:#0c0f1a;border-bottom:1px solid #1a2238;padding:0 16px;position:sticky;top:52px;z-index:90;flex-shrink:0}
.tab{padding:12px 14px;background:none;border:none;border-bottom:2px solid transparent;color:#39495e;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;font-family:inherit;white-space:nowrap}
.tab.on{border-bottom-color:#c9a84c;color:#e0be70}
.main{flex:1;padding:20px 16px;max-width:1120px;margin:0 auto;width:100%}
.card{background:#101524;border:1px solid #1a2238;border-radius:14px;padding:20px;margin-bottom:14px}
.bgh{padding:8px 16px;border:1px solid #232d44;border-radius:8px;background:transparent;color:#7e8fa8;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.bgh:hover{border-color:#2c3a54;color:#e5e8f2}
.result{background:#101524;border:1.5px solid #2c3a54;border-radius:12px;padding:22px;white-space:pre-wrap;font-size:14px;line-height:1.85;color:#e5e8f2;margin-top:14px}
.flbl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#39495e;margin-bottom:6px}
.finp{width:100%;padding:10px 13px;background:#0c0f1a;border:1.5px solid #232d44;border-radius:8px;color:#e5e8f2;font-size:13px;font-family:inherit;outline:none;transition:border-color .18s;margin-bottom:10px}
.finp:focus{border-color:#c9a84c}
textarea.finp{resize:vertical;min-height:76px;line-height:1.6}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
@media(max-width:650px){.g2,.g3{grid-template-columns:1fr}.dg{grid-template-columns:1fr!important}.cg{grid-template-columns:1fr!important}}
.dv{display:flex;align-items:center;gap:12px;margin:14px 0 10px}
.dv span{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#39495e;white-space:nowrap}
.dv hr{flex:1;border:none;border-top:1px solid #1a2238}
.ebar{background:rgba(239,68,68,.08);border-bottom:1px solid rgba(239,68,68,.15);padding:9px 16px;display:none;align-items:center;justify-content:space-between}
.ebar span{font-size:12px;color:#fca5a5}
.ebar button{background:none;border:none;color:#f87171;cursor:pointer;font-size:18px}
footer{border-top:1px solid #1a2238;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;flex-shrink:0}
footer span{font-size:10px;color:#39495e}
</style>

</head>

function t() { return UI[S.lang] || UI.en; }
function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// ── NAV ──
function showPage(id) {
  var pages = document.querySelectorAll(".page");
  for (var i = 0; i < pages.length; i++) {
    pages[i].style.display = "none";
    pages[i].classList.remove("active");
  }
  document.getElementById("dash").style.display = "none";
  var el = document.getElementById(id);
  if (el) {
    el.style.display = "flex";
    el.classList.add("active");
  }
}

function showDash() {
  var pages = document.querySelectorAll(".page");
  for (var i = 0; i < pages.length; i++) {
    pages[i].classList.remove("active");
    pages[i].style.display = "none";
  }
  document.getElementById("dash").style.display = "flex";
}

function showSync(msg) {
  var el = document.getElementById("d-sync");
  el.textContent = msg; el.style.display = "block";
  setTimeout(function() { el.style.display = "none"; }, 2500);
}

function showErr(msg) {
  document.getElementById("d-errm").textContent = msg;
  document.getElementById("d-err").style.display = "flex";
}

// ── LANG ──
function pickLang(code) {
  S.lang = code;
  lsSet("pt_lang", code);
  try {
    if (S.uid) {
      if (S.country) {
        // Already logged in - just refresh UI without reloading data
        if (document.getElementById("dash").style.display === "flex") {
          updateDashUI();
        } else {
          initDash();
        }
      } else {
        initCountry();
      }
    } else {
      initLogin();
      showPage("p-login");
    }
  } catch(ex) {
    alert("Error: " + ex.message);
  }
}

// ── LOGIN ──
function initLogin() {
  var u = t();
  document.getElementById("l-title").textContent = S.isReg ? u.regTitle : u.title;
  document.getElementById("l-email").textContent = u.el;
  document.getElementById("l-pass").textContent = u.pw;
  document.getElementById("l-btn").textContent = S.isReg ? u.rb : u.lb;
  document.getElementById("l-sw1").textContent = S.isReg ? u.ha : u.na;
  document.getElementById("l-sw2").textContent = S.isReg ? u.lb : u.rb;
}

function toggleReg() {
  S.isReg = !S.isReg;
  document.getElementById("l-err").style.display = "none";
  initLogin();
}

function doAuth() {
  var u = t();
  var email = document.getElementById("i-email").value.trim();
  var pass = document.getElementById("i-pass").value.trim();
  var errEl = document.getElementById("l-err");
  errEl.style.display = "none";
  if (!email || !pass) { errEl.textContent = u.ef; errEl.style.display = "block"; return; }
  if (pass.length < 6) { errEl.textContent = u.ep; errEl.style.display = "block"; return; }
  var btn = document.getElementById("l-btn");
  btn.disabled = true;
  btn.innerHTML = '<span class="sp"></span> ' + (S.isReg ? u.ri : u.li);
  hashPw(pass).then(function(hash) {
    if (S.isReg) {
      return dbsel("users", "email=eq." + encodeURIComponent(email) + "&select=id").then(function(ex) {
        if (Array.isArray(ex) && ex.length > 0) { errEl.textContent = u.ee; errEl.style.display = "block"; btn.disabled = false; initLogin(); return; }
        return dbins("users", {email: email, password_hash: hash}).then(function(res) {
          if (!Array.isArray(res) || !res[0]) { errEl.textContent = u.er; errEl.style.display = "block"; btn.disabled = false; initLogin(); return; }
          S.uid = res[0].id; S.email = res[0].email;
          lsSet("pt_uid", S.uid); lsSet("pt_email", S.email);
          initCountry();
        });
      });
    } else {
      return dbsel("users", "email=eq." + encodeURIComponent(email) + "&password_hash=eq." + hash + "&select=id,email").then(function(res) {
        if (!Array.isArray(res) || res.length === 0) { errEl.textContent = u.eli; errEl.style.display = "block"; btn.disabled = false; initLogin(); return; }
        S.uid = res[0].id; S.email = res[0].email;
        lsSet("pt_uid", S.uid); lsSet("pt_email", S.email);
        if (S.country) initDash(); else initCountry();
      });
    }
  }).catch(function(ex) {
    errEl.textContent = u.eg + ex.message; errEl.style.display = "block";
    btn.disabled = false; initLogin();
  });
}

// ── COUNTRY ──
function initCountry() {
  var u = t();
  document.getElementById("c-email").textContent = S.email;
  document.getElementById("c-lo").textContent = u.lo;
  document.getElementById("c-ts").textContent = u.ts2;
  document.getElementById("c-pc").textContent = u.pc;
  showPage("p-country");
}

function pickCountry(code) {
  try {
    S.country = code;
    lsSet("pt_country", code);
    if (!S.lang) {
      var langMap = {SE:"sv",NO:"no",DK:"da",PL:"pl",DE:"de",FR:"fr",GB:"en",HU:"hu",RO:"ro",AT:"de"};
      S.lang = langMap[code] || "en";
      lsSet("pt_lang", S.lang);
    }
    // Hide country page first
    var cp = document.getElementById("p-country");
    if (cp) cp.style.display = "none";
    // Show dash
    var dash = document.getElementById("dash");
    if (dash) dash.style.display = "flex";
    // Update UI
    updateDashUI();
    // Load data
    Promise.all([
      dbsel("projects","user_id=eq."+S.uid+"&order=created_at.desc"),
      dbsel("clients","user_id=eq."+S.uid+"&order=created_at.desc"),
      dbsel("templates","user_id=eq."+S.uid+"&order=created_at.desc"),
      dbsel("agents","user_id=eq."+S.uid)
    ]).then(function(results) {
      if (Array.isArray(results[0])) S.projects = results[0];
      if (Array.isArray(results[1])) S.clients = results[1];
      if (Array.isArray(results[2])) S.templates = results[2];
      if (Array.isArray(results[3]) && results[3].length > 0) S.agent = results[3][0];
      renderTab();
    }).catch(function(e) { console.error(e); renderTab(); });
  } catch(ex) {
    alert("pickCountry error: " + ex.message);
  }
}

  document.getElementById("d-ak").value = "";

// ── CLAUDE ──
function callClaude(prompt) {
  if (!S.key) { showErr(t().nk); return Promise.reject(new Error("No key")); }
  return fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {"content-type":"application/json","x-api-key":S.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body: JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1024,messages:[{role:"user",content:prompt}]})
  }).then(function(r) {
    if (!r.ok) return r.json().then(function(e) { throw new Error(e.error ? e.error.message : "API " + r.status); });
    return r.json();
  }).then(function(d) {
    return (d.content || []).filter(function(b) { return b.type === "text"; }).map(function(b) { return b.text; }).join("") || "";
  });
}

// ── PROMPT ──
function buildPrompt(type, d, cc, lang) {
  var c = CC[cc] || CC.GB;
  var li = LW[lang] || LW.en;
  var rows = [["Project",d.name],["Address",d.addr],["Price",d.price],["Rooms",d.rooms],["Floor area",d.size?d.size+" m²":""],["Plot",d.plot?d.plot+" m²":""],["Year",d.year],["Floor",d.floor],["Balcony",d.balc?d.balc+" m²":""],["Parking",d.park],["Condition",d.cond],["Orientation",d.orient],["Heating",d.heat],["Energy",d.energy],["Structure",d.walls],["View",d.view],["Elevator",d.lift],["Area",d.hood],["Extras",d.extra],["Type",d.isLuxury?"Luxury":"Standard"]];
  var props = rows.filter(function(r) { return r[1] && String(r[1]).trim(); }).map(function(r) { return r[0]+": "+r[1]; }).join("\n");
  var h = "Market: "+c.market+"\n"+li+"\n\nProperty:\n"+(props||"(minimal data)")+"\n\nOnly use provided data.\n\n";
  var prompts = {
    listing: h+"Write a warm, lifestyle-focused property listing.\n1.HEADLINE - emotional and evocative, max 10 words\n2.OPENING - paint a picture of daily life here, 2-3 sentences\n3.HIGHLIGHTS - 5-7 bullet points about lifestyle and features\n4.NEIGHBOURHOOD - local character, cafes, parks, community\n5.CTA - warm and inviting\nFocus on lifestyle and living experience. You may briefly mention investment value once if relevant, but do not let it dominate.\nMax 380 words.",
    brochure: h+"Write a premium brochure.\n1.HEADLINE\n2.STORY\n3.HIGHLIGHTS\n4.LOCATION\n5.TECHNICAL\n6.CLOSING\nMax 500 words.",
    lead: h+"Create a lead magnet.\n1.TITLE\n2.INTRO\n3.5 TIPS\n4.PROPERTY\n5.CTA\nMax 400 words.",
    email: h+"Write a prospecting email.\nSUBJECT:[subject]\n---\nOpening, highlights, CTA.\nMax 280 words.",
    ads: h+"Create 3 ads:\nFACEBOOK: Hook+Body+CTA+hashtags\nGOOGLE: 3 Headlines(30c)+2 Descriptions(90c)\nLINKEDIN: Professional+CTA"
  };
  return prompts[type] || prompts.listing;
}

var tmplList = S.templates.length===0 ? ‘<div style="background:#0c0f1a;border:2px dashed #232d44;border-radius:10px;padding:32px;text-align:center"><p style="font-size:13px;color:#39495e">’+u.nt+’</p></div>’ :
‘<div style="display:flex;flex-direction:column;gap:8px;max-height:380px;overflow-y:auto">’+
S.templates.map(function(tmpl){return’<div style="background:#0c0f1a;border:1px solid #1a2238;border-radius:10px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px"><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;color:#7e8fa8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">’+esc(tmpl.name)+’</div><div style="font-size:10px;color:#39495e">’+(CC[tmpl.country]?CC[tmpl.country].flag:””)+” “+(CC[tmpl.country]?CC[tmpl.country].name:””)+’</div></div><div style="display:flex;gap:6px"><button onclick="loadTmpl(\''+tmpl.id+'\')" class="bgh" style="font-size:10px;padding:5px 11px">’+u.ut+’</button><button onclick="delTmpl(\''+tmpl.id+'\')" class="bgh" style="font-size:10px;padding:5px 10px">’+u.dt+’</button></div></div>’;}).join(””)+
‘</div>’;
return ‘<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:900px;margin:0 auto" class="dg">’+
‘<div class="card"><h2 class="serif" style="font-size:20px;font-weight:600;color:#e5e8f2;margin-bottom:18px">’+u.agt+’</h2>’+
[[“agn”,“name”],[“agp”,“phone”],[“age”,“email”],[“aga”,“agency”],[“agl”,“logo”]].map(function(x){return’<div class="flbl">’+u[x[0]]+’</div><input class=“finp” value=”’+esc(ag[x[1]]||””)+’” oninput=“S.agent.’+x[1]+’=this.value”’+(x[1]===“email”?’ type=“email”’:””)+’/>’;}).join(””)+
(ag.logo?’<div style="margin-top:4px;padding:12px;background:#0c0f1a;border-radius:8px;text-align:center"><img src="'+esc(ag.logo)+'" style="max-width:120px;max-height:60px;object-fit:contain;border-radius:6px" onerror="this.style.display=\'none\'"/></div>’:””)+
‘<button onclick="saveAgent()" style="width:100%;margin-top:14px;padding:12px;border:none;border-radius:9px;background:linear-gradient(135deg,#c9a84c,#e0be70);color:#07080c;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit" id="bags">’+u.ags+’</button></div>’+
‘<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px"><h2 class="serif" style="font-size:20px;font-weight:600;color:#e5e8f2">’+u.tt+’</h2><span style="padding:2px 8px;border-radius:99px;font-size:9px;font-weight:700;background:rgba(139,92,246,.1);color:#c4b5fd;border:1px solid rgba(139,92,246,.2)">’+S.templates.length+’</span></div>’+tmplList+’</div>’+
‘</div>’;
}

function saveAgent() {
var u = t(); var btn = document.getElementById(“bags”);
if (btn) { btn.disabled = true; btn.textContent = u.sv2; }
dbupsert(“agents”, Object.assign({user_id:S.uid}, S.agent, {updated_at:new Date().toISOString()}))
.then(function(res) { if (Array.isArray(res)&&res[0]) S.agent=res[0]; showSync(u.sy); if(btn){btn.textContent=u.agsd;setTimeout(function(){btn.textContent=u.ags;},2200);} })
.catch(function(e) { showErr(e.message); })
.then(function() { if(btn) btn.disabled=false; });
}

function loadTmpl(id) {
var tmpl = null; for(var i=0;i<S.templates.length;i++){if(S.templates[i].id===id){tmpl=S.templates[i];break;}}
if (!tmpl) return;
F = Object.assign({}, EF, tmpl.form_data||{});
S.tab = 0;
var tabs = document.querySelectorAll(”.tab”);
for (var j=0;j<tabs.length;j++) tabs[j].classList.toggle(“on”,j===0);
renderTab();
}

function delTmpl(id) {
S.templates = S.templates.filter(function(x){return x.id!==id;});
renderTab();
dbdel(“templates”,“id=eq.”+id).catch(function(){});
}

// ── CRM ──
function rCRM() {
var u = t(); var cl = S.clients||[];
var cards = cl.length===0 ? ‘<div class="card" style="border:2px dashed #1a2238;padding:52px;text-align:center"><p style="font-size:14px;color:#39495e">’+u.cn2+’</p></div>’ :
‘<div style="display:flex;flex-direction:column;gap:9px">’+
cl.map(function(c){
var si = u.sts.indexOf(c.status);
var sc = si<1?“rgba(59,130,246,.12)”:si<4?“rgba(201,168,76,.12)”:“rgba(16,185,129,.12)”;
var st = si<1?”#93c5fd”:si<4?”#e0be70”:”#6ee7b7”;
var sb = si<1?“rgba(59,130,246,.25)”:si<4?“rgba(201,168,76,.25)”:“rgba(16,185,129,.25)”;
return’<div class="card">’+
‘<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:9px">’+
‘<div><h4 style="font-size:14px;font-weight:700;color:#e5e8f2;margin-bottom:6px">’+esc(c.name)+’</h4>’+(c.status?’<span style="padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase;background:'+sc+';color:'+st+';border:1px solid '+sb+'">’+esc(c.status)+’</span>’:’’)+’</div>’+
‘<div style="display:flex;gap:6px;align-items:center">’+
(c.phone?’<a href=“https://wa.me/’+c.phone.replace(/\D/g,””)+’” target=”_blank” style=“padding:5px 10px;border-radius:7px;border:1px solid rgba(16,185,129,.25);background:rgba(16,185,129,.08);color:#6ee7b7;font-size:10px;font-weight:700;text-decoration:none”>💬</a>’:””)+
(c.email?’<a href="mailto:'+esc(c.email)+'" style="padding:5px 10px;border-radius:7px;border:1px solid rgba(59,130,246,.25);background:rgba(59,130,246,.08);color:#93c5fd;font-size:10px;font-weight:700;text-decoration:none">✉</a>’:””)+
‘<button onclick="delClient(\''+c.id+'\')" class="bgh" style="font-size:11px;padding:3px 8px">’+u.cd2+’</button>’+
‘</div>’+
‘</div>’+
[[c.phone,“📞”],[c.email,“✉”],[c.prop,“🏠”]].filter(function(x){return x[0];}).map(function(x){return’<span style="font-size:12px;color:#39495e;margin-right:14px">’+x[1]+” “+esc(x[0])+’</span>’;}).join(””)+
(c.note?’<p style="font-size:12px;color:#39495e;font-style:italic;margin-top:9px;padding-top:9px;border-top:1px solid #1a2238">”’+esc(c.note)+’”</p>’:””)+
‘</div>’;
}).join(””)+’</div>’;

var opts = ‘<option value="">—</option>’+u.sts.map(function(s){return’<option>’+s+’</option>’;}).join(””);
return ‘<div style="display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start" class="cg">’+
‘<div class="card">’+
‘<h2 class="serif" style="font-size:20px;font-weight:600;color:#e5e8f2;margin-bottom:18px">’+u.ct+’</h2>’+
‘<div class="flbl">’+u.cn+’</div><input class="finp" id="c-n" placeholder="'+u.cn+'"/>’+
‘<div class="flbl">’+u.cph+’</div><input class="finp" id="c-ph" placeholder="+..."/>’+
‘<div class="flbl">’+u.cem+’</div><input class="finp" id="c-em" type="email"/>’+
‘<div class="flbl">’+u.cpr+’</div><input class="finp" id="c-pr"/>’+
‘<div class="flbl">’+u.cst+’</div><select class="finp" id="c-st">’+opts+’</select>’+
‘<div class="flbl">’+u.cno+’</div><textarea class="finp" id="c-no"></textarea>’+
‘<button onclick="addClient()" style="width:100%;padding:12px;border:none;border-radius:9px;background:linear-gradient(135deg,#c9a84c,#e0be70);color:#07080c;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit" id="bca">’+u.ca+’</button>’+
‘<div style="height:1px;background:#1a2238;margin:14px 0"></div>’+
‘<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">’+
‘<div style="background:#0c0f1a;border-radius:7px;padding:10px 12px"><div style="font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#39495e;margin-bottom:4px">Total</div><div class="serif" style="font-size:26px;font-weight:600;color:#e5e8f2">’+cl.length+’</div></div>’+
‘<div style="background:#0c0f1a;border-radius:7px;padding:10px 12px"><div style="font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#39495e;margin-bottom:4px">Active</div><div class="serif" style="font-size:26px;font-weight:600;color:#e5e8f2">’+cl.filter(function(c){return c.status!==u.sts[u.sts.length-1];}).length+’</div></div>’+
‘</div>’+
‘</div>’+
‘<div>’+cards+’</div>’+
‘</div>’;
}

function addClient() {
var u = t();
var name = (document.getElementById(“c-n”)||{}).value;
if (!name || !name.trim()) return;
var data = {name:name.trim(),phone:((document.getElementById(“c-ph”)||{}).value||””).trim(),email:((document.getElementById(“c-em”)||{}).value||””).trim(),prop:((document.getElementById(“c-pr”)||{}).value||””).trim(),status:((document.getElementById(“c-st”)||{}).value||””),note:((document.getElementById(“c-no”)||{}).value||””).trim()};
var btn = document.getElementById(“bca”); if(btn){btn.disabled=true;btn.textContent=u.sv2;}
dbins(“clients”,Object.assign({user_id:S.uid},data))
.then(function(res){if(Array.isArray(res)&&res[0]){S.clients.unshift(res[0]);showSync(u.sy);renderTab();}})
.catch(function(e){showErr(e.message);})
.then(function(){if(btn){btn.disabled=false;btn.textContent=u.ca;}});
}

function delClient(id) {
S.clients = S.clients.filter(function(c){return c.id!==id;});
renderTab();
dbdel(“clients”,“id=eq.”+id).catch(function(){});
}

// ── BOOT ──
(function() {
if (S.lang) {
if (S.uid && S.country) { initDash(); }
else if (S.uid) { initCountry(); }
else { initLogin(); showPage(“p-login”); }
}
// else: lang screen is already shown by default
})();
</script>
