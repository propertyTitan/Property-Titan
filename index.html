<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

.gold{background:linear-gradient(135deg,#c9a84c,#e0be70);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.screen.on{display:flex;flex-direction:column}
.grid-bg{background-image:linear-gradient(var(--bdr) 1px,transparent 1px),linear-gradient(90deg,var(--bdr) 1px,transparent 1px);background-size:54px 54px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .4s ease both}
.sp{display:inline-block;width:14px;height:14px;border:2px solid rgba(201,168,76,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
input,textarea,select{width:100%;padding:10px 13px;background:var(--surf);border:1.5px solid var(--bdr2);border-radius:8px;color:var(--tx);font-size:13px;font-family:inherit;outline:none;transition:border-color .18s}
input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.08)}
textarea{resize:vertical;min-height:80px;line-height:1.6}
select option{background:var(--surf)}
.lbl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px}
.bg{padding:12px 20px;border:none;border-radius:9px;background:linear-gradient(135deg,#c9a84c,#e0be70);color:#07080c;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.08em;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;box-shadow:0 4px 18px rgba(201,168,76,.2)}
.bg:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(201,168,76,.3)}
.bg:disabled{background:var(--bdr3);color:var(--tx3);cursor:not-allowed;box-shadow:none;transform:none}
.bgh{padding:8px 16px;border:1px solid var(--bdr2);border-radius:8px;background:transparent;color:var(--tx2);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .18s}
.bgh:hover{border-color:var(--bdr3);color:var(--tx)}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:20px}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--bdr)}
.tb{padding:12px 14px;background:none;border:none;border-bottom:2px solid transparent;color:var(--tx3);font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;font-family:inherit;white-space:nowrap;transition:color .18s}
.tb.on{border-bottom-color:var(--gold);color:var(--gold2)}
.rb{background:var(--card);border:1.5px solid var(--bdr3);border-radius:12px;padding:22px;white-space:pre-wrap;font-size:14px;line-height:1.85;color:var(--tx);margin-top:14px}
.dv{display:flex;align-items:center;gap:12px;margin:18px 0 14px}
.dv span{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--tx3);white-space:nowrap}
.dv hr{flex:1;border:none;border-top:1px solid var(--bdr)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.pulse{width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block;animation:pulse 2s ease infinite;box-shadow:0 0 6px var(--gold)}

/* LOGIN */
function initLogin(){
  const u=t();
  document.getElementById("lt").textContent=S.isReg?u.rt:u.lt;
  document.getElementById("ls").textContent=u.ls;
  document.getElementById("le").textContent=u.el;
  document.getElementById("lp").textContent=u.pl;
  document.getElementById("lb").textContent=S.isReg?u.rb:u.lb;
  document.getElementById("lsw1").textContent=S.isReg?u.ha:u.na;
  document.getElementById("lsw2").textContent=S.isReg?u.lb:u.rb;
}
function toggleAuth(){S.isReg=!S.isReg;document.getElementById("lerr").style.display="none";initLogin();}

async function doAuth(){
  const u=t();
  const email=document.getElementById("ie").value.trim();
  const pass=document.getElementById("ip").value.trim();
  const el=document.getElementById("lerr");el.style.display="none";
  if(!email||!pass){el.textContent=u.ef;el.style.display="block";return;}
  if(pass.length<6){el.textContent=u.ep2;el.style.display="block";return;}
  const btn=document.getElementById("lb");btn.disabled=true;
  btn.innerHTML=`<span class="sp"></span> ${S.isReg?u.ri:u.li}`;
  try{
    const hash=await hashPw(pass);
    if(S.isReg){
      const ex=await dbsel("users","email=eq."+encodeURIComponent(email)+"&select=id");
      if(Array.isArray(ex)&&ex.length>0){el.textContent=u.ee;el.style.display="block";return;}
      const res=await dbins("users",{email,password_hash:hash});
      if(!Array.isArray(res)||!res[0]){el.textContent=u.er;el.style.display="block";return;}
      S.uid=res[0].id;S.email=res[0].email;
    }else{
      const res=await dbsel("users","email=eq."+encodeURIComponent(email)+"&password_hash=eq."+hash+"&select=id,email");
      if(!Array.isArray(res)||res.length===0){el.textContent=u.eli;el.style.display="block";return;}
      S.uid=res[0].id;S.email=res[0].email;
    }
    ls.set("pt_uid",S.uid);ls.set("pt_email",S.email);
    if(S.country)initDash();else initCountry();
  }catch(ex){el.textContent=u.eg+ex.message;el.style.display="block";}
  finally{btn.disabled=false;initLogin();}
}

/* CLAUDE */
async function claude(prompt){
  if(!S.key){err(t().nk);return null;}
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":S.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1024,messages:[{role:"user",content:prompt}]})});
  if(!r.ok){const er=await r.json().catch(()=>({}));throw new Error(er?.error?.message||"API "+r.status);}
  const d=await r.json();
  return(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("")||"";
}

/* PROMPT */
function buildPrompt(type,d,cc,lang){
  const c=CC[cc]||CC.GB;const li=LW[lang]||LW.en;
  const props=[["Project",d.name],["Address",d.addr],["Price",d.price],["Rooms",d.rooms],["Floor area",d.size?d.size+" m²":""],["Plot",d.plot?d.plot+" m²":""],["Year",d.year],["Floor",d.floor],["Balcony",d.balc?d.balc+" m²":""],["Parking",d.park],["Condition",d.cond],["Orientation",d.orient],["Heating",d.heat],["Energy",d.energy],["Structure",d.walls],["View",d.view],["Elevator",d.lift],["Area",d.hood],["Extras",d.extra],["Type",d.isLuxury?"Luxury":"Standard"]].filter(([,v])=>v&&String(v).trim()).map(([k,v])=>k+": "+v).join("\n");
  const h="Market: "+c.market+"\n"+li+"\n\nProperty:\n"+(props||"(minimal data)")+"\n\nOnly use provided data.\n\n";
  const p={listing:h+"Write a compelling listing.\n1.HEADLINE\n2.OPENING(2-3 sentences)\n3.HIGHLIGHTS(5-7 bullets)\n4.NEIGHBOURHOOD\n5.CTA\nMax 380 words.",brochure:h+"Write a premium brochure.\n1.HEADLINE\n2.STORY\n3.HIGHLIGHTS\n4.LOCATION\n5.TECHNICAL\n6.CLOSING\nMax 500 words.",lead:h+"Create a lead magnet.\n1.TITLE\n2.INTRO\n3.5 TIPS\n4.PROPERTY\n5.CTA\nMax 400 words.",email:h+"Write a prospecting email.\nSUBJECT:[subject]\n---\nOpening, highlights, CTA.\nMax 280 words.",ads:h+"Create 3 ads:\nFACEBOOK: Hook+Body+CTA+hashtags\nGOOGLE: 3 Headlines(30c)+2 Descriptions(90c)\nLINKEDIN: Professional+CTA"};
  return p[type]||p.listing;
}

  try{

    if(Array.isArray(res)&&res[0])S.agent=res[0];
    sync(u.sy);if(btn)btn.textContent=u.agsd;setTimeout(()=>btn&&(btn.textContent=u.ags),2200);
  }catch(ex){err(ex.message);}
  if(btn)btn.disabled=false;
}
function loadTmpl(id){const t=S.templates.find(x=>x.id===id);if(!t)return;F={...EF,...t.form_data};S.tab=0;document.querySelectorAll(".tb").forEach((b,j)=>b.classList.toggle("on",j===0));renderTab();}
async function delTmpl(id){S.templates=S.templates.filter(x=>x.id!==id);renderTab();try{await dbdel("templates","id=eq."+id);}catch{}}

/* CRM TAB */
function rCRM(){
const u=t();const cl=S.clients||[];
return`<div style="display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start" class="cg fi">

  <div class="card">
    <h2 class="serif" style="font-size:20px;font-weight:600;color:var(--tx);letter-spacing:-.02em;margin-bottom:18px">${u.ct}</h2>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div><div class="lbl">${u.cn}</div><input id="cn" placeholder="${u.cn}"/></div>
      <div><div class="lbl">${u.cph}</div><input id="cph" placeholder="+..."/></div>
      <div><div class="lbl">${u.cem}</div><input id="cem" type="email"/></div>
      <div><div class="lbl">${u.cpr}</div><input id="cpr"/></div>
      <div><div class="lbl">${u.cst}</div><select id="cst"><option value="">—</option>${u.sts.map(s=>`<option>${s}</option>`).join("")}</select></div>
      <div><div class="lbl">${u.cno}</div><textarea id="cno"></textarea></div>
    </div>
    <button onclick="addClient()" class="bg" style="width:100%;margin-top:14px" id="bca">${u.ca}</button>
    <div style="height:1px;background:var(--bdr);margin:14px 0"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">
      <div style="background:var(--surf);border-radius:7px;padding:10px 12px"><div style="font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin-bottom:4px">Total</div><div class="serif" style="font-size:26px;font-weight:600;color:var(--tx)">${cl.length}</div></div>
      <div style="background:var(--surf);border-radius:7px;padding:10px 12px"><div style="font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin-bottom:4px">Active</div><div class="serif" style="font-size:26px;font-weight:600;color:var(--tx)">${cl.filter(c=>c.status!==u.sts[u.sts.length-1]).length}</div></div>
    </div>
  </div>
  <div>
    ${cl.length===0?`<div class="card" style="border:2px dashed var(--bdr);padding:52px;text-align:center"><p style="font-size:14px;color:var(--tx3)">${u.cn2}</p></div>`
    :`<div style="display:flex;flex-direction:column;gap:9px">${cl.map(c=>{
      const si=u.sts.indexOf(c.status);
      const sc=si<1?"rgba(59,130,246,.12)":si<4?"rgba(201,168,76,.12)":"rgba(16,185,129,.12)";
      const st=si<1?"#93c5fd":si<4?"#e0be70":"#6ee7b7";
      const sb=si<1?"rgba(59,130,246,.25)":si<4?"rgba(201,168,76,.25)":"rgba(16,185,129,.25)";
      return`<div class="card" onmouseover="this.style.borderColor='var(--bdr2)'" onmouseout="this.style.borderColor='var(--bdr)'">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:9px">
          <div><h4 style="font-size:14px;font-weight:700;color:var(--tx);margin-bottom:6px">${e(c.name)}</h4>
            ${c.status?`<span style="padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase;background:${sc};color:${st};border:1px solid ${sb}">${e(c.status)}</span>`:""}
          </div>
          <div style="display:flex;gap:6px;align-items:center">
            ${c.phone?`<a href="https://wa.me/${c.phone.replace(/\D/g,"")}" target="_blank" style="padding:5px 10px;border-radius:7px;border:1px solid rgba(16,185,129,.25);background:rgba(16,185,129,.08);color:#6ee7b7;font-size:10px;font-weight:700;text-decoration:none">💬</a>`:""}
            ${c.email?`<a href="mailto:${e(c.email)}" style="padding:5px 10px;border-radius:7px;border:1px solid rgba(59,130,246,.25);background:rgba(59,130,246,.08);color:#93c5fd;font-size:10px;font-weight:700;text-decoration:none">✉</a>`:""}
            <button onclick="delClient('${c.id}')" class="bgh" style="font-size:11px;padding:3px 8px">${u.cd2}</button>
          </div>
        </div>
        ${[[c.phone,"📞"],[c.email,"✉"],[c.prop,"🏠"]].filter(([v])=>v).map(([v,icon])=>`<span style="font-size:12px;color:var(--tx3);margin-right:14px">${icon} ${e(v)}</span>`).join("")}
        ${c.note?`<p style="font-size:12px;color:var(--tx3);font-style:italic;margin-top:9px;padding-top:9px;border-top:1px solid var(--bdr)">"${e(c.note)}"</p>`:""}
      </div>`;}).join("")}</div>`}
  </div>
</div>`;
}
async function addClient(){
  const u=t();
  const name=document.getElementById("cn")?.value.trim();if(!name)return;
  const data={name,phone:document.getElementById("cph")?.value.trim()||"",email:document.getElementById("cem")?.value.trim()||"",prop:document.getElementById("cpr")?.value.trim()||"",status:document.getElementById("cst")?.value||"",note:document.getElementById("cno")?.value.trim()||""};
  const btn=document.getElementById("bca");if(btn){btn.disabled=true;btn.textContent=u.sv2;}
  try{
    const res=await dbins("clients",{user_id:S.uid,...data});
    if(Array.isArray(res)&&res[0]){S.clients.unshift(res[0]);sync(u.sy);renderTab();}
  }catch(ex){err(ex.message);}
  if(btn){btn.disabled=false;btn.textContent=u.ca;}
}
async function delClient(id){S.clients=S.clients.filter(c=>c.id!==id);renderTab();try{await dbdel("clients","id=eq."+id);}catch{}}

/* BOOT */
function boot(){
initLang();
if(S.lang){
if(S.uid&&S.country)initDash();
else if(S.uid)initCountry();
else{initLogin();go(“s-login”);}
}
}
if(document.readyState===“loading”){document.addEventListener(“DOMContentLoaded”,boot);}else{boot();}
</script>
