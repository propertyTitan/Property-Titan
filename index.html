/* ── PROMPTS ── */
const buildPropStr = d => [[“Project”,d.name],[“Address”,d.addr],[“Price”,d.price],[“Rooms”,d.rooms],[“Floor area”,d.size?d.size+” m²”:””],[“Plot”,d.plot?d.plot+” m²”:””],[“Year”,d.year],[“Floor”,d.floor],[“Balcony”,d.balc?d.balc+” m²”:””],[“Parking”,d.park],[“Condition”,d.cond],[“Orientation”,d.orient],[“Heating”,d.heat],[“Energy”,d.energy],[“Structure”,d.walls],[“View”,d.view],[“Elevator”,d.lift],[“Area”,d.hood],[“Extras”,d.extra],[“Type”,d.isLuxury?“Luxury”:“Standard”]].filter(([,v])=>v&&String(v).trim()).map(([k,v])=>`${k}: ${v}`).join(”\n”);

const buildPrompt = (type,d,cc,lang) => {
const c=COUNTRIES[cc]||COUNTRIES.GB;
const li=LANG_WRITE[lang]||LANG_WRITE.en;
const props=buildPropStr(d);
const hdr=`Market: ${c.market}\n${li}\n\nProperty:\n${props||"(minimal data)"}\n\nOnly use provided data.\n\n`;
const p={
listing:hdr+“Write a compelling listing ad.\n1.HEADLINE\n2.OPENING(2-3 sentences)\n3.HIGHLIGHTS(5-7 bullets)\n4.NEIGHBOURHOOD\n5.CTA\nMax 380 words.”,
brochure:hdr+“Write a premium brochure.\n1.HEADLINE\n2.STORY(2 paragraphs)\n3.HIGHLIGHTS(6 bullets)\n4.LOCATION\n5.TECHNICAL DATA\n6.CLOSING\nMax 500 words.”,
lead:hdr+“Create a buyer’s guide lead magnet.\n1.TITLE\n2.INTRO\n3.5 TIPS\n4.PROPERTY MENTION\n5.CTA\nMax 400 words.”,
email:hdr+“Write a prospecting email.\nSUBJECT:[subject]\n—\nPersonal opening, highlights, CTA.\nMax 280 words.”,
ads:hdr+“Create 3 ads:\nFACEBOOK: Hook+Body+CTA+hashtags\nGOOGLE: 3 Headlines(30c)+2 Descriptions(90c)\nLINKEDIN: Professional+CTA”,
};
return p[type]||p.listing;
};

/* ── HELPERS ── */
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)??“null”)??d;}catch{return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};

const exportPDF=(text,agent,name=“Property Titan”)=>{
const w=window.open(””,”_blank”);
if(!w)return;
const ab=agent?.name?`<div style="display:flex;align-items:center;gap:16px;margin-top:48px;padding-top:24px;border-top:1px solid #ddd;">${agent.logo?`<img src="${agent.logo}" style="width:56px;height:56px;object-fit:contain;border-radius:8px;"/>`:""} <div><div style="font-size:16px;font-weight:700;">${agent.name}</div>${agent.agency?`<div style="font-size:13px;color:#555;">${agent.agency}</div>`:""}${agent.phone?`<div style="font-size:12px;color:#666;">📞 ${agent.phone}</div>`:""}${agent.email?`<div style="font-size:12px;color:#666;">✉ ${agent.email}</div>`:""}</div></div>`:””;
w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${name}</title><style>body{font-family:Georgia,serif;max-width:700px;margin:0 auto;padding:48px 40px;color:#111;line-height:1.8;font-size:15px;}pre{white-space:pre-wrap;font-family:Georgia,serif;}</style></head><body><h1>${name}</h1><p style="color:#888;font-size:11px;margin-bottom:32px;">Property Titan AI · ${new Date().toLocaleDateString()}</p><pre>${text.replace(/</g,"&lt;")}</pre>${ab}<script>window.onload=()=>window.print();<\/script></body></html>`);
w.document.close();
};

/* ── COMPONENTS ── */
const Spin=({color=“var(–gold)”})=><span style={{display:“inline-block”,width:14,height:14,border:“2px solid rgba(201,168,76,0.2)”,borderTopColor:color,borderRadius:“50%”,animation:“spin .7s linear infinite”}}/>;

const Inp=({label,val,set,ph=””,multi=false,type=“text”})=>{
const[f,setF]=useState(false);
const base={width:“100%”,padding:“10px 13px”,background:“var(–surf)”,border:`1.5px solid ${f?"var(--gold)":"var(--bdr2)"}`,borderRadius:8,color:“var(–tx)”,fontSize:13,fontFamily:“inherit”,outline:“none”,transition:“border-color .18s,box-shadow .18s”,boxShadow:f?“0 0 0 3px rgba(201,168,76,0.08)”:“none”};
return(<div>{label&&<div style={{fontSize:10,fontWeight:700,letterSpacing:“0.12em”,textTransform:“uppercase”,color:“var(–tx3)”,marginBottom:6}}>{label}</div>}{multi?<textarea value={val} onChange={e=>set(e.target.value)} placeholder={ph} onFocus={()=>setF(true)} onBlur={()=>setF(false)} style={{…base,minHeight:76,resize:“vertical”,lineHeight:1.6}}/>:<input type={type} value={val} onChange={e=>set(e.target.value)} placeholder={ph} onFocus={()=>setF(true)} onBlur={()=>setF(false)} style={base}/>}</div>);
};

const Hr=({label})=>(<div style={{display:“flex”,alignItems:“center”,gap:12,margin:“18px 0 14px”}}>{label&&<span style={{fontSize:10,fontWeight:700,letterSpacing:“0.15em”,textTransform:“uppercase”,color:“var(–tx3)”,whiteSpace:“nowrap”}}>{label}</span>}<div style={{flex:1,height:1,background:“var(–bdr)”}}/></div>);

const CopyBtn=({text,t})=>{const[done,setDone]=useState(false);return<button onClick={()=>{navigator.clipboard.writeText(text);setDone(true);setTimeout(()=>setDone(false),2200);}} style={{padding:“6px 14px”,borderRadius:8,border:`1px solid ${done?"rgba(16,185,129,.35)":"var(--bdr3)"}`,background:done?“rgba(16,185,129,.1)”:“var(–card2)”,color:done?”#6ee7b7”:“var(–tx2)”,fontSize:11,fontWeight:700,cursor:“pointer”,fontFamily:“inherit”,transition:“all .2s”}}>{done?t.copied:t.copy}</button>;};

const ResultPanel=({text,loading,t,onClear,agent,propName})=>{
if(!text&&!loading)return null;
return(<div className="fi" style={{marginTop:20}}>
<div style={{display:“flex”,alignItems:“center”,justifyContent:“space-between”,marginBottom:12,flexWrap:“wrap”,gap:8}}>
<div style={{display:“flex”,alignItems:“center”,gap:8}}><span style={{width:6,height:6,borderRadius:“50%”,background:“var(–gold)”,display:“inline-block”,animation:“pulse 2s ease infinite”,boxShadow:“0 0 6px var(–gold)”}}/><span style={{fontSize:10,fontWeight:700,letterSpacing:“0.15em”,textTransform:“uppercase”,color:“var(–gold)”}}>{t.result}</span></div>

                <button onClick={()=>delClient(c.id)} style={{background:"none",border:"none",color:"var(--tx3)",cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"inherit",padding:"3px 6px"}}>{t.crmDel}</button>
              </div>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"5px 14px"}}>{[[c.phone,"📞"],[c.email,"✉"],[c.prop,"🏠"]].filter(([v])=>v).map(([v,icon])=><span key={v} style={{fontSize:12,color:"var(--tx3)"}}>{icon} {v}</span>)}</div>
            {c.note&&<p style={{fontSize:12,color:"var(--tx3)",fontStyle:"italic",marginTop:9,paddingTop:9,borderTop:"1px solid var(--bdr)"}}>"{c.note}"</p>}
          </div>);
        })}
      </div>}
    </div>
  </div>)}

/* ── ROOT ── */
function App(){
const[userId,   setUserId]  =useState(()=>lsGet(“pt_uid”,””));
const[userEmail,setEmail]   =useState(()=>lsGet(“pt_email”,””));
const[country,  setCountry] =useState(()=>lsGet(“pt_country”,””));
const[uiLang,   setUiLang]  =useState(()=>lsGet(“pt_uilang”,””));

const handleLangSelect=lang=>{setUiLang(lang);lsSet(“pt_uilang”,lang);};
const handleLogin=(uid,email)=>{setUserId(uid);setEmail(email);};
const handleLogout=()=>{
setUserId(””);setEmail(””);setCountry(””);setUiLang(””);
lsSet(“pt_uid”,””);lsSet(“pt_email”,””);lsSet(“pt_country”,””);lsSet(“pt_uilang”,””);
};

// 1. No language selected yet → Language Picker
if(!uiLang) return React.createElement(LangPicker,{onSelect:handleLangSelect});

// 2. Language selected but not logged in → Login in chosen language
if(!userId) return React.createElement(LoginScreen,{onLogin:handleLogin,lang:uiLang});

// 3. Logged in but no country → Country Picker
if(!country) return React.createElement(CountryPicker,{onSelect:c=>{setCountry(c);lsSet(“pt_country”,c);},userEmail,onLogout:handleLogout,lang:uiLang});

// 4. All set → Dashboard
return React.createElement(Dashboard,{userId,userEmail,country,onChangeCountry:()=>{setCountry(””);lsSet(“pt_country”,””);},onLogout:handleLogout});
}

ReactDOM.createRoot(document.getElementById(“root”)).render(React.createElement(App));
</script>
