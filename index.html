<!DOCTYPE html>

<html lang="hu">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Property Titan</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07090f;color:#e5e8f2;font-family:'DM Sans',sans-serif;min-height:100vh}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.page{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px}
.page.active{display:flex}
.grid{background-image:linear-gradient(#1a2238 1px,transparent 1px),linear-gradient(90deg,#1a2238 1px,transparent 1px);background-size:54px 54px;position:fixed;inset:0;opacity:.25;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;width:100%;max-width:840px;text-align:center}
h1.big{font-size:clamp(48px,8vw,88px);font-weight:600;line-height:.9;letter-spacing:-.03em;color:#e5e8f2}
h1.gold{font-size:clamp(48px,8vw,88px);font-weight:600;line-height:.95;letter-spacing:-.03em;font-style:italic;background:linear-gradient(135deg,#c9a84c,#e0be70);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.badge{display:inline-flex;align-items:center;gap:7px;background:rgba(201,168,76,.09);border:1px solid rgba(201,168,76,.2);border-radius:99px;padding:5px 14px;margin-bottom:22px}
.dot{width:5px;height:5px;border-radius:50%;background:#c9a84c;animation:pulse 2s ease infinite;box-shadow:0 0 6px #c9a84c}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.lang-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:28px;width:100%}
.lang-btn{background:#101524;border:1px solid #232d44;border-radius:14px;padding:18px 12px;cursor:pointer;color:#e5e8f2;font-family:inherit;transition:all .2s}
.lang-btn:hover{border-color:#c9a84c;transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.3)}
.flag{font-size:28px;margin-bottom:8px}
.lname{font-size:12px;font-weight:700;color:#7e8fa8}

/* LOGIN */
.login-box{background:#101524;border:1px solid #232d44;border-radius:20px;padding:40px;width:100%;max-width:420px}
.inp-wrap{margin-bottom:14px}
.inp-wrap label{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#39495e;margin-bottom:6px}
.inp-wrap input{width:100%;padding:11px 13px;background:#0c0f1a;border:1.5px solid #232d44;border-radius:8px;color:#e5e8f2;font-size:16px;font-family:inherit;outline:none;transition:border-color .18s}
.inp-wrap input:focus{border-color:#c9a84c;box-shadow:0 0 0 3px rgba(201,168,76,.08)}
.btn-gold{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg,#c9a84c,#e0be70);color:#07080c;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;box-shadow:0 4px 20px rgba(201,168,76,.25)}
.btn-gold:disabled{background:#2c3a54;color:#39495e;cursor:not-allowed;box-shadow:none}
.err{margin-top:12px;padding:10px 14px;border-radius:8px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);font-size:12px;color:#fca5a5;display:none}
.sp{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.2);border-top-color:#07080c;border-radius:50%;animation:spin .7s linear infinite}

/* COUNTRY */
.country-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:11px;margin-top:20px;width:100%}
.country-btn{background:#101524;border:1px solid #232d44;border-radius:14px;padding:18px 14px;cursor:pointer;color:#e5e8f2;font-family:inherit;transition:all .25s;text-align:center}
.country-btn:hover{border-color:#c9a84c;transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.3)}

/* DASH */
#dash{display:none;flex-direction:column;min-height:100vh}
#dash.active{display:flex}
.topbar{background:#0c0f1a;border-bottom:1px solid #1a2238;padding:0 16px;height:52px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;flex-shrink:0}
.apibar{background:#060c18;border-bottom:1px solid #091225;padding:8px 16px}
.apibar-inner{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.api-inp{flex:1;min-width:140px;padding:7px 11px;background:rgba(59,130,246,.05);border:1.5px solid #0b1e38;border-radius:7px;color:#93c5fd;font-family:monospace;font-size:12px;outline:none}
.api-btn{padding:7px 14px;border-radius:7px;border:1.5px solid rgba(59,130,246,.2);background:rgba(59,130,246,.07);color:#93c5fd;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit}
.banner{background:linear-gradient(90deg,rgba(201,168,76,.05),rgba(59,130,246,.03));border-bottom:1px solid #1a2238;padding:9px 16px;font-size:12px;font-weight:700;color:#e0be70}
.tabs{display:flex;overflow-x:auto;background:#0c0f1a;border-bottom:1px solid #1a2238;padding:0 16px;position:sticky;top:52px;z-index:90;flex-shrink:0}
.tab{padding:12px 14px;background:none;border:none;border-bottom:2px solid transparent;color:#39495e;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;font-family:inherit;white-space:nowrap}
.tab.on{border-bottom-color:#c9a84c;color:#e0be70}
.main{flex:1;padding:20px 16px;max-width:1120px;margin:0 auto;width:100%}
.card{background:#101524;border:1px solid #1a2238;border-radius:14px;padding:20px;margin-bottom:14px}
.bgh{padding:8px 16px;border:1px solid #232d44;border-radius:8px;background:transparent;color:#7e8fa8;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.bgh:hover{border-color:#2c3a54;color:#e5e8f2}
.result{background:#101524;border:1.5px solid #2c3a54;border-radius:12px;padding:22px;white-space:pre-wrap;font-size:14px;line-height:1.85;color:#e5e8f2;margin-top:14px}
.flbl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#39495e;margin-bottom:6px}
.finp{width:100%;padding:10px 13px;background:#0c0f1a;border:1.5px solid #232d44;border-radius:8px;color:#e5e8f2;font-size:16px;font-family:inherit;outline:none;transition:border-color .18s;margin-bottom:10px}
.finp:focus{border-color:#c9a84c}
textarea.finp{resize:vertical;min-height:76px;line-height:1.6}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
@media(max-width:650px){.g2,.g3{grid-template-columns:1fr}.dg{grid-template-columns:1fr!important}.cg{grid-template-columns:1fr!important}}
.dv{display:flex;align-items:center;gap:12px;margin:14px 0 10px}
.dv span{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#39495e;white-space:nowrap}
.dv hr{flex:1;border:none;border-top:1px solid #1a2238}
.ebar{background:rgba(239,68,68,.08);border-bottom:1px solid rgba(239,68,68,.15);padding:9px 16px;display:none;align-items:center;justify-content:space-between}
.ebar span{font-size:12px;color:#fca5a5}
.ebar button{background:none;border:none;color:#f87171;cursor:pointer;font-size:18px}
footer{border-top:1px solid #1a2238;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;flex-shrink:0}
footer span{font-size:10px;color:#39495e}

/* IMAGE UPLOAD */
.img-drop{border:2px dashed #232d44;border-radius:12px;padding:32px 20px;text-align:center;cursor:pointer;transition:all .25s;background:#0c0f1a}
.img-drop:hover,.img-drop.drag{border-color:#c9a84c;background:rgba(201,168,76,.04)}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:12px}
.img-thumb{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/3;background:#0c0f1a;border:1px solid #1a2238}
.img-thumb img{width:100%;height:100%;object-fit:cover}
.img-thumb .img-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.img-thumb .img-badge{position:absolute;bottom:4px;left:4px;padding:2px 7px;border-radius:6px;font-size:8px;font-weight:700;text-transform:uppercase}
.img-badge.original{background:rgba(59,130,246,.15);color:#93c5fd;border:1px solid rgba(59,130,246,.25)}
.img-badge.enhanced{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.25)}
.img-mode{display:flex;gap:3px;background:#0c0f1a;border-radius:8px;padding:3px;border:1px solid #1a2238;margin-bottom:12px}
.img-mode button{flex:1;border:none;border-radius:6px;padding:7px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.ai-feedback{margin-top:12px;background:#0c0f1a;border:1px solid #1a2238;border-radius:10px;padding:14px;font-size:12px;line-height:1.7;color:#7e8fa8;white-space:pre-wrap}
.ai-feedback h4{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#c9a84c;margin-bottom:8px}
</style>

</head>
<body>

<!-- LANG -->

<div id="p-lang" class="page active">
  <div class="grid"></div>
  <div class="wrap">
    <div class="badge"><span class="dot"></span><span style="font-size:10px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:#e0be70">Premium AI Platform · Europe</span></div>
    <h1 class="serif big">Property</h1>
    <h1 class="serif gold">Titan</h1>
    <p style="font-size:14px;color:#7e8fa8;margin-top:16px">Choose your language to continue</p>
    <div class="lang-grid">
      <button class="lang-btn" onclick="pickLang('sv')"><div class="flag">🇸🇪</div><div class="lname">Svenska</div></button>
      <button class="lang-btn" onclick="pickLang('no')"><div class="flag">🇳🇴</div><div class="lname">Norsk</div></button>
      <button class="lang-btn" onclick="pickLang('da')"><div class="flag">🇩🇰</div><div class="lname">Dansk</div></button>
      <button class="lang-btn" onclick="pickLang('pl')"><div class="flag">🇵🇱</div><div class="lname">Polski</div></button>
      <button class="lang-btn" onclick="pickLang('de')"><div class="flag">🇩🇪</div><div class="lname">Deutsch</div></button>
      <button class="lang-btn" onclick="pickLang('fr')"><div class="flag">🇫🇷</div><div class="lname">Français</div></button>
      <button class="lang-btn" onclick="pickLang('en')"><div class="flag">🇬🇧</div><div class="lname">English</div></button>
      <button class="lang-btn" onclick="pickLang('hu')"><div class="flag">🇭🇺</div><div class="lname">Magyar</div></button>
      <button class="lang-btn" onclick="pickLang('ro')"><div class="flag">🇷🇴</div><div class="lname">Română</div></button>
    </div>
    <p style="margin-top:28px;font-size:11px;color:#39495e">Claude Sonnet AI · 10 Countries · 9 Languages</p>
    <button onclick="openDemo()" style="margin-top:18px;padding:10px 28px;border:1.5px solid rgba(201,168,76,.35);border-radius:99px;background:rgba(201,168,76,.08);color:#e0be70;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.05em;transition:all .2s" onmouseover="this.style.background='rgba(201,168,76,.15)';this.style.borderColor='#c9a84c'" onmouseout="this.style.background='rgba(201,168,76,.08)';this.style.borderColor='rgba(201,168,76,.35)'">Demo</button>
  </div>
</div>

<!-- DEMO -->

<div id="p-demo" class="page">
  <div class="grid"></div>
  <div style="position:fixed;top:16px;left:16px;z-index:100">
    <button onclick="showPage('p-lang')" style="padding:8px 16px;border:1px solid #232d44;border-radius:10px;background:#101524;color:#7e8fa8;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">&#8592; Back</button>
  </div>
  <div style="position:relative;z-index:1;width:100%;max-width:960px;margin:0 auto;padding:32px 16px">
    <div style="text-align:center;margin-bottom:32px">
      <div class="badge"><span class="dot"></span><span style="font-size:10px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:#e0be70">DEMO</span></div>
      <h1 class="serif gold" style="font-size:36px;font-weight:600;font-style:italic;margin-bottom:8px">Property Titan</h1>
      <p id="demo-sub" style="font-size:14px;color:#7e8fa8"></p>
      <div style="margin-top:18px;display:inline-flex;align-items:center;gap:10px">
        <select id="demo-country" onchange="switchDemoCountry(this.value)" style="padding:12px 40px 12px 18px;border:1.5px solid #232d44;border-radius:10px;background:#101524 url('data:image/svg+xml,<%3Fxml version=%271.0%27%3F><svg xmlns=%27http://www.w3.org/2000/svg%27 width=%2716%27 height=%2716%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272.5%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27><polyline points=%276 9 12 15 18 9%27/></svg>') no-repeat right 14px center;color:#e5e8f2;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;-webkit-appearance:none;-moz-appearance:none;appearance:none"></select>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start" class="cg">
      <div class="card">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
          <span style="font-size:20px" id="demo-flag"></span>
          <h2 class="serif" style="font-size:20px;font-weight:600;color:#e5e8f2" id="demo-title"></h2>
        </div>
        <div id="demo-props" style="display:flex;flex-direction:column;gap:6px"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="card">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
            <span style="width:6px;height:6px;border-radius:50%;background:#c9a84c;display:inline-block"></span>
            <span style="font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#c9a84c" id="demo-label"></span>
          </div>
          <div class="result" id="demo-result" style="white-space:pre-wrap;font-size:13px;line-height:1.8;color:#c8cdd8"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px" id="demo-tabs"></div>
      </div>
    </div>
    <div style="text-align:center;margin-top:32px">
      <p style="font-size:13px;color:#39495e;margin-bottom:14px" id="demo-cta-text"></p>
      <button onclick="showPage('p-lang')" style="padding:12px 36px;border:none;border-radius:9px;background:linear-gradient(135deg,#c9a84c,#e0be70);color:#07080c;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit" id="demo-cta-btn"></button>
    </div>
  </div>
</div>

<!-- LOGIN -->

<div id="p-login" class="page">
  <div class="grid"></div>
  <div class="login-box" style="position:relative;z-index:1">
    <div style="text-align:center;margin-bottom:28px">
      <h1 class="serif gold" style="font-size:42px;font-weight:600;font-style:italic;margin-bottom:6px">Titan</h1>
      <h2 class="serif" id="l-title" style="font-size:21px;font-weight:600;color:#e5e8f2;margin-bottom:6px"></h2>
      <p style="font-size:13px;color:#39495e">Property Titan AI Platform</p>
    </div>
    <div class="inp-wrap"><label id="l-email"></label><input type="email" id="i-email" placeholder="name@email.com"/></div>
    <div class="inp-wrap"><label id="l-pass"></label><input type="password" id="i-pass" placeholder="min. 6 karakter"/></div>
    <div class="err" id="l-err"></div>
    <button class="btn-gold" id="l-btn" onclick="doAuth()" style="margin-top:16px"></button>
    <div style="text-align:center;margin-top:16px">
      <span id="l-sw1" style="font-size:12px;color:#39495e"></span>
      <button onclick="toggleReg()" style="background:none;border:none;color:#e0be70;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit" id="l-sw2"></button>
    </div>
    <button onclick="showPage('p-lang')" style="background:none;border:none;color:#39495e;font-size:11px;cursor:pointer;font-family:inherit;margin-top:10px;display:block;width:100%;text-align:center">← Back</button>
    <button onclick="openDemo()" style="margin-top:12px;padding:8px 24px;border:1.5px solid rgba(201,168,76,.35);border-radius:99px;background:rgba(201,168,76,.08);color:#e0be70;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.05em;transition:all .2s;display:block;width:auto;margin-left:auto;margin-right:auto" onmouseover="this.style.background='rgba(201,168,76,.15)';this.style.borderColor='#c9a84c'" onmouseout="this.style.background='rgba(201,168,76,.08)';this.style.borderColor='rgba(201,168,76,.35)'">Demo</button>
  </div>
</div>

<!-- COUNTRY -->

<div id="p-country" class="page">
  <div class="grid"></div>
  <div style="position:fixed;top:16px;right:16px;display:flex;align-items:center;gap:10px;background:#101524;border:1px solid #1a2238;border-radius:10px;padding:8px 14px;z-index:100">
    <span id="c-email" style="font-size:11px;color:#39495e"></span>
    <button onclick="doLogout()" class="bgh" style="font-size:10px;padding:4px 10px" id="c-lo"></button>
  </div>
  <div class="wrap">
    <h1 class="serif big">Property</h1>
    <h1 class="serif gold" style="margin-bottom:20px">Titan</h1>
    <div style="background:rgba(201,168,76,.09);border:1px solid rgba(201,168,76,.18);border-radius:12px;padding:12px 20px;display:inline-block;margin-bottom:22px">
      <div style="font-size:14px;font-weight:700;color:#e0be70" id="c-ts"></div>
    </div>
    <p style="font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#39495e;margin-bottom:16px" id="c-pc"></p>
    <div class="country-grid">
      <button class="country-btn" onclick="pickCountry('SE')"><div class="flag">🇸🇪</div><div style="font-size:12px;font-weight:700;color:#7e8fa8">Sverige</div><div style="font-size:10px;color:#39495e">Svenska</div></button>
      <button class="country-btn" onclick="pickCountry('NO')"><div class="flag">🇳🇴</div><div style="font-size:12px;font-weight:700;color:#7e8fa8">Norge</div><div style="font-size:10px;color:#39495e">Norsk</div></button>
      <button class="country-btn" onclick="pickCountry('DK')"><div class="flag">🇩🇰</div><div style="font-size:12px;font-weight:700;color:#7e8fa8">Danmark</div><div style="font-size:10px;color:#39495e">Dansk</div></button>
      <button class="country-btn" onclick="pickCountry('PL')"><div class="flag">🇵🇱</div><div style="font-size:12px;font-weight:700;color:#7e8fa8">Polska</div><div style="font-size:10px;color:#39495e">Polski</div></button>
      <button class="country-btn" onclick="pickCountry('DE')"><div class="flag">🇩🇪</div><div style="font-size:12px;font-weight:700;color:#7e8fa8">Deutschland</div><div style="font-size:10px;color:#39495e">Deutsch</div></button>
      <button class="country-btn" onclick="pickCountry('FR')"><div class="flag">🇫🇷</div><div style="font-size:12px;font-weight:700;color:#7e8fa8">France</div><div style="font-size:10px;color:#39495e">Français</div></button>
      <button class="country-btn" onclick="pickCountry('GB')"><div class="flag">🇬🇧</div><div style="font-size:12px;font-weight:700;color:#7e8fa8">United Kingdom</div><div style="font-size:10px;color:#39495e">English</div></button>
      <button class="country-btn" onclick="pickCountry('HU')"><div class="flag">🇭🇺</div><div style="font-size:12px;font-weight:700;color:#7e8fa8">Magyarország</div><div style="font-size:10px;color:#39495e">Magyar</div></button>
      <button class="country-btn" onclick="pickCountry('RO')"><div class="flag">🇷🇴</div><div style="font-size:12px;font-weight:700;color:#7e8fa8">România</div><div style="font-size:10px;color:#39495e">Română</div></button>
      <button class="country-btn" onclick="pickCountry('AT')"><div class="flag">🇦🇹</div><div style="font-size:12px;font-weight:700;color:#7e8fa8">Österreich</div><div style="font-size:10px;color:#39495e">Deutsch</div></button>
    </div>
  </div>
</div>

<!-- DASHBOARD -->

<div id="dash">
  <div class="topbar">
    <span class="serif" style="font-size:18px;font-weight:600;color:#e5e8f2">Property <span style="background:linear-gradient(135deg,#c9a84c,#e0be70);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Titan</span></span>

function showPage(id) {
  var pages = document.querySelectorAll(".page");
  for (var i = 0; i < pages.length; i++) {
    pages[i].style.display = "none";
    pages[i].classList.remove("active");
  }
  document.getElementById("dash").style.display = "none";
  var el = document.getElementById(id);
  if (el) {
    el.style.display = "flex";
    el.classList.add("active");
  }
  window.scrollTo(0, 0);
}

function showDash() {
  var pages = document.querySelectorAll(".page");
  for (var i = 0; i < pages.length; i++) {
    pages[i].style.display = "none";
    pages[i].classList.remove("active");
  }
  document.getElementById("dash").style.display = "flex";
  window.scrollTo(0, 0);
}

function showSync(msg) {
  var el = document.getElementById("d-sync");
  el.textContent = msg; el.style.display = "block";
  setTimeout(function() { el.style.display = "none"; }, 2500);
}

function showErr(msg) {
  document.getElementById("d-errm").textContent = msg;
  document.getElementById("d-err").style.display = "flex";
}

function doAuth() {
  var u = t();
  var email = document.getElementById("i-email").value.trim();
  var pass = document.getElementById("i-pass").value.trim();
  var errEl = document.getElementById("l-err");
  errEl.style.display = "none";
  if (!email || !pass) { errEl.textContent = u.ef; errEl.style.display = "block"; return; }
  if (pass.length < 6) { errEl.textContent = u.ep; errEl.style.display = "block"; return; }
  var btn = document.getElementById("l-btn");
  btn.disabled = true;
  btn.innerHTML = '<span class="sp"></span> ' + (S.isReg ? u.ri : u.li);
  hashPw(pass).then(function(hash) {
    if (S.isReg) {
      return dbsel("users", "email=eq." + encodeURIComponent(email) + "&select=id").then(function(ex) {
        if (Array.isArray(ex) && ex.length > 0) { errEl.textContent = u.ee; errEl.style.display = "block"; btn.disabled = false; initLogin(); return; }
        return dbins("users", {email: email, password_hash: hash}).then(function(res) {
          if (!Array.isArray(res) || !res[0]) { errEl.textContent = u.er; errEl.style.display = "block"; btn.disabled = false; initLogin(); return; }
          S.uid = res[0].id; S.email = res[0].email;
          lsSet("pt_uid", S.uid); lsSet("pt_email", S.email);
          initCountry();
        });
      });
    } else {
      return dbsel("users", "email=eq." + encodeURIComponent(email) + "&password_hash=eq." + hash + "&select=id,email").then(function(res) {
        if (!Array.isArray(res) || res.length === 0) { errEl.textContent = u.eli; errEl.style.display = "block"; btn.disabled = false; initLogin(); return; }
        S.uid = res[0].id; S.email = res[0].email;
        lsSet("pt_uid", S.uid); lsSet("pt_email", S.email);
        if (S.country) initDash(); else initCountry();
      });
    }
  }).catch(function(ex) {
    errEl.textContent = u.eg + ex.message; errEl.style.display = "block";
    btn.disabled = false; initLogin();
  });
}

// ── CLAUDE ──
function callClaude(prompt, images) {
  var payload = {prompt: prompt};
  if (images && images.length > 0) {
    payload.images = images.map(function(img) {
      return {data: img.base64, media_type: img.type || "image/jpeg"};
    });
  }
  return fetch("/api/generate", {
    method: "POST",
    headers: {"content-type":"application/json"},
    body: JSON.stringify(payload)
  }).then(function(r) {
    if (!r.ok) return r.json().then(function(e) { throw new Error(e.error || "API " + r.status); });
    return r.json();
  }).then(function(d) {
    return d.text || "";
  });
}

  var props = rows.filter(function(r) { return r[1] && String(r[1]).trim(); }).map(function(r) { return r[0]+": "+r[1]; }).join("\n");
  var h = "Market: "+c.market+"\n"+li+"\n\nProperty:\n"+(props||"(minimal data)")+"\n\nOnly use provided data.\n\n";
  var prompts = {
    listing: h+"Write a compelling listing.\n1.HEADLINE\n2.OPENING(2-3 sentences)\n3.HIGHLIGHTS(5-7 bullets)\n4.NEIGHBOURHOOD\n5.CTA\nMax 380 words.",

    ads: h+"Create 3 ads:\nFACEBOOK: Hook+Body+CTA+hashtags\nGOOGLE: 3 Headlines(30c)+2 Descriptions(90c)\nLINKEDIN: Professional+CTA"
  };
  return prompts[type] || prompts.listing;
}

// ── IMAGE HANDLING ──
function handleImageFiles(files) {
  if (!files || files.length === 0) return;
  var maxImages = 10;
  var maxSize = 5 * 1024 * 1024;
  var remaining = maxImages - S.images.length;
  if (remaining <= 0) { showErr("Max " + maxImages + " images"); return; }
  var toProcess = Math.min(files.length, remaining);
  var processed = 0;

  for (var i = 0; i < toProcess; i++) {
    (function(file) {
      if (!file.type.match(/^image\/(jpeg|png|webp)$/)) return;
      if (file.size > maxSize) { showErr(file.name + " > 5MB"); return; }
      var reader = new FileReader();
      reader.onload = function(e) {
        var dataUrl = e.target.result;
        var base64 = dataUrl.split(",")[1];
        S.images.push({
          id: "img_" + Date.now() + "_" + Math.random().toString(36).substr(2,5),
          name: file.name,
          type: file.type,
          dataUrl: dataUrl,
          base64: base64,

function enhanceAllImages() {

function enhanceSingleImage(index) {
  var img = S.images[index];
  if (!img || img.enhanced) return;
  var image = new Image();
  image.onload = function() {
    var canvas = document.createElement("canvas");
    canvas.width = image.width;
    canvas.height = image.height;
    var ctx = canvas.getContext("2d");
    ctx.drawImage(image, 0, 0);
    var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    var data = imageData.data;

    // Calculate average brightness
    var totalBright = 0;
    var pixelCount = data.length / 4;
    for (var i = 0; i < data.length; i += 4) {
      totalBright += (data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114);
    }
    var avgBright = totalBright / pixelCount;

    // Adaptive brightness & contrast
    var brightAdjust = 0;
    var contrastMult = 1.0;
    if (avgBright < 100) { brightAdjust = 25; contrastMult = 1.15; }
    else if (avgBright < 130) { brightAdjust = 12; contrastMult = 1.08; }
    else if (avgBright > 200) { brightAdjust = -10; contrastMult = 1.05; }
    else { brightAdjust = 5; contrastMult = 1.05; }

    // Slight warmth for real estate (adds inviting feel)
    var warmR = 4, warmG = 1, warmB = -3;

    // Saturation boost
    var satBoost = 1.12;

    for (var j = 0; j < data.length; j += 4) {
      var r = data[j], g = data[j+1], b = data[j+2];

      // Brightness
      r += brightAdjust; g += brightAdjust; b += brightAdjust;

      // Contrast
      r = ((r - 128) * contrastMult) + 128;
      g = ((g - 128) * contrastMult) + 128;
      b = ((b - 128) * contrastMult) + 128;

      // Warmth
      r += warmR; g += warmG; b += warmB;

      // Saturation
      var gray = 0.299 * r + 0.587 * g + 0.114 * b;
      r = gray + satBoost * (r - gray);
      g = gray + satBoost * (g - gray);
      b = gray + satBoost * (b - gray);

      // Clamp
      data[j]   = Math.max(0, Math.min(255, Math.round(r)));
      data[j+1] = Math.max(0, Math.min(255, Math.round(g)));
      data[j+2] = Math.max(0, Math.min(255, Math.round(b)));
    }

    ctx.putImageData(imageData, 0, 0);

    // Simple unsharp mask (sharpen)
    var sharpCanvas = document.createElement("canvas");
    sharpCanvas.width = canvas.width;
    sharpCanvas.height = canvas.height;
    var sctx = sharpCanvas.getContext("2d");
    sctx.drawImage(canvas, 0, 0);
    sctx.globalAlpha = 0.3;
    sctx.globalCompositeOperation = "luminosity";
    sctx.filter = "contrast(1.1) brightness(1.02)";
    sctx.drawImage(canvas, 0, 0);

    img.enhancedDataUrl = sharpCanvas.toDataURL("image/jpeg", 0.92);
    img.enhanced = true;
    renderImageGrid();
  };
  image.src = img.dataUrl;
}

.then(function() { if(btn) btn.disabled=false; });
}

function loadTmpl(id) {

if (!tmpl) return;
F = Object.assign({}, EF, tmpl.form_data||{});
S.tab = 0;
var tabs = document.querySelectorAll(".tab");
for (var j=0;j<tabs.length;j++) tabs[j].classList.toggle("on",j===0);
renderTab();
}

function delTmpl(id) {
S.templates = S.templates.filter(function(x){return x.id!==id;});
renderTab();
dbdel("templates","id=eq."+id).catch(function(){});
}

(c.email?'<a href="mailto:'+esc(c.email)+'" style="padding:5px 10px;border-radius:7px;border:1px solid rgba(59,130,246,.25);background:rgba(59,130,246,.08);color:#93c5fd;font-size:10px;font-weight:700;text-decoration:none">✉</a>':"")+

'</div>'+
'</div>'+
[[c.phone,"📞"],[c.email,"✉"],[c.prop,"🏠"]].filter(function(x){return x[0];}).map(function(x){return'<span style="font-size:12px;color:#39495e;margin-right:14px">'+x[1]+" "+esc(x[0])+'</span>';}).join("")+
(c.note?'<p style="font-size:12px;color:#39495e;font-style:italic;margin-top:9px;padding-top:9px;border-top:1px solid #1a2238">"'+esc(c.note)+'"</p>':"")+
'</div>';
}).join("")+'</div>';

function addClient() {
var u = t();
var name = (document.getElementById("c-n")||{}).value;
if (!name || !name.trim()) return;
var data = {name:name.trim(),phone:((document.getElementById("c-ph")||{}).value||"").trim(),email:((document.getElementById("c-em")||{}).value||"").trim(),prop:((document.getElementById("c-pr")||{}).value||"").trim(),status:((document.getElementById("c-st")||{}).value||""),note:((document.getElementById("c-no")||{}).value||"").trim()};
var btn = document.getElementById("bca"); if(btn){btn.disabled=true;btn.textContent=u.sv2;}
if (S.editCid) {
dbupd("clients","id=eq."+S.editCid,data)
.then(function(){
for(var i=0;i<S.clients.length;i++){if(S.clients[i].id===S.editCid){Object.assign(S.clients[i],data);break;}}
S.editCid="";showSync(u.sy);renderTab();
})
.catch(function(e){showErr(e.message);})
.then(function(){if(btn){btn.disabled=false;btn.textContent=u.cu;}});
} else {
dbins("clients",Object.assign({user_id:S.uid},data))
.then(function(res){if(Array.isArray(res)&&res[0]){S.clients.unshift(res[0]);showSync(u.sy);renderTab();}})
.catch(function(e){showErr(e.message);})
.then(function(){if(btn){btn.disabled=false;btn.textContent=u.ca;}});
}
}

function editClient(id) {
var c = null;
for (var i = 0; i < S.clients.length; i++) { if (S.clients[i].id === id) { c = S.clients[i]; break; } }
if (!c) return;
S.editCid = id;
renderTab();
setTimeout(function() {
var n = document.getElementById("c-n"); if (n) n.value = c.name || "";
var ph = document.getElementById("c-ph"); if (ph) ph.value = c.phone || "";
var em = document.getElementById("c-em"); if (em) em.value = c.email || "";
var pr = document.getElementById("c-pr"); if (pr) pr.value = c.prop || "";
var st = document.getElementById("c-st"); if (st) st.value = c.status || "";
var no = document.getElementById("c-no"); if (no) no.value = c.note || "";
}, 10);
}

function cancelEdit() {
S.editCid = "";
renderTab();
}

function delClient(id) {
S.clients = S.clients.filter(function(c){return c.id!==id;});
if (S.editCid === id) S.editCid = "";
renderTab();
dbdel("clients","id=eq."+id).catch(function(){});
}
